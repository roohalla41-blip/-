<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="theme-color" content="#3b46f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="description" content="حساب صراف — سامانه تخصصی مدیریت صرافی و خدمات مالی. مادر ۲۰۲۶" />
    <title>حساب صراف — مادر ۲۰۲۶</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Unregister any stale service workers to prevent cached JS conflicts
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
